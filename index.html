<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulado – Métodos e Técnicas em Ergonomia</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#dfe3ea;--pri:#2f5bea;--pri2:#e8eefe;--ok:#15803d;--okbg:#e6f6ec;--ko:#b91c1c;--kobg:#fdecec;--wa:#a16207;--wabg:#fdf3dc}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--tx:#e8ebf1;--mut:#9aa3b5;--bd:#2c3340;--pri:#6c8cff;--pri2:#222b45;--ok:#4ade80;--okbg:#14301f;--ko:#f87171;--kobg:#3a1a1a;--wa:#facc15;--wabg:#352c12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:1.4rem;margin:.2rem 0 .1rem}h2{font-size:1.05rem;margin:1.2rem 0 .5rem}
.sub{color:var(--mut);font-size:.9rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button.pri:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{padding:6px 12px;border-radius:999px;font-size:.88rem}
.chip.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.topic{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;font-size:.92rem}
.topic.on{border-color:var(--pri);background:var(--pri2)}
.topic input{margin-top:4px}
.topic small{color:var(--mut);display:block}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri);transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:.85rem;margin:8px 0 12px;flex-wrap:wrap}
.badge{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:999px;background:var(--pri2);color:var(--pri);font-weight:600;margin-right:6px}
.q{font-size:1.12rem;margin:10px 0 16px}
.q input.blank{font:inherit;width:11em;max-width:100%;padding:2px 8px;border:0;border-bottom:2px solid var(--pri);background:var(--pri2);color:var(--tx);border-radius:6px 6px 0 0;outline:none;margin:2px 3px}
.q input.blank.ok{border-color:var(--ok);background:var(--okbg)}
.q input.blank.ko{border-color:var(--ko);background:var(--kobg)}
.opts{display:grid;gap:9px}
.opt{text-align:left;padding:12px 14px;display:flex;gap:10px}
.opt .k{color:var(--mut);font-weight:700;min-width:1.2em}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;border:1px solid var(--bd)}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.ko{background:var(--kobg);border-color:var(--ko)}
.fb.wa{background:var(--wabg);border-color:var(--wa)}
.fb b.t{display:block;margin-bottom:2px}
.exp{color:var(--mut);font-size:.92rem;margin-top:6px}
textarea{width:100%;min-height:90px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.stat b{font-size:1.4rem;display:block}.stat span{color:var(--mut);font-size:.82rem}
.miss{border-top:1px solid var(--bd);padding:10px 0;font-size:.95rem}
.miss:first-child{border-top:0}.miss small{color:var(--mut)}
.right{margin-left:auto}
.hint{color:var(--mut);font-size:.8rem;margin-top:10px}
a{color:var(--pri)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// Banco de questões — Cap. 3 "Métodos e técnicas em ergonomia" (Iida, Ergonomia: Projeto e Produção)
// c = completar (___ = lacuna; respostas aceitas separadas por |)
// m = múltipla escolha | v = verdadeiro/falso | o = pergunta aberta (autoavaliação)
const T = {
  met: "Métodos e técnicas",
  qst: "Questionário",
  ent: "Entrevista e grupo de foco",
  obs: "Observação direta",
  psi: "Técnicas psicofísicas",
  chk: "Checklists",
  pos: "RULA, OWAS e REBA",
  ocr: "OCRA, NIOSH e NASA-TLX",
  fis: "Avaliações fisiológicas",
  cog: "Análise cognitiva e usabilidade",
  prd: "Desenvolvimento de produto",
  aet: "Análise ergonômica e AET",
};
const c = (topic, text, answers, exp = "") => ({ type: "c", topic, text, answers: answers.map(a => a.split("|")), exp });
const m = (topic, q, correct, wrong, exp = "") => ({ type: "m", topic, q, correct, wrong, exp });
const v = (topic, q, ans, exp = "") => ({ type: "v", topic, q, ans, exp });
const o = (topic, q, model) => ({ type: "o", topic, q, model });

const QUESTIONS = [
// ───────────── MÉTODOS E TÉCNICAS (3.1) ─────────────
c(T.met, "Os(as) ___ são operações, ações ou modos de executar uma atividade e são hierarquicamente inferiores ao método.", ["técnicas|tecnicas"]),
c(T.met, "O ___ é mais amplo que a técnica e pode ser composto de várias técnicas.", ["método|metodo"]),
c(T.met, "A ergonomia é uma ciência ___ de natureza interdisciplinar.", ["aplicada"]),
c(T.met, "As três grandes áreas da ergonomia são a ergonomia ___, a ergonomia cognitiva e a ergonomia organizacional.", ["física|fisica"]),
c(T.met, "A ergonomia utiliza métodos e técnicas das ciências naturais, das humanas e das ___.", ["sociais"]),
c(T.met, "Técnicas de análises estatísticas só podem ser aplicadas quando todos os dados já estiverem ___.", ["coletados|coletadas|levantados|obtidos"]),
c(T.met, "A escolha de métodos e técnicas depende da natureza da pesquisa, do objetivo pretendido, dos ___ e tempo disponíveis e da habilidade e experiência do pesquisador.", ["recursos"]),
c(T.met, "Cada profissional (médico, engenheiro, psicólogo, designer) tende a ver o problema segundo seu viés profissional, gerando ___.", ["subotimizações|subotimizacoes|suboptimizações"]),
c(T.met, "Para a solução final não ficar 'torta', o problema deve ser definido com clareza e deve haver uma ___ eficaz.", ["coordenação|coordenacao"]),
c(T.met, "A ergonomia ___ trata da interação humano-computador.", ["cognitiva"]),
c(T.met, "A ergonomia ___ trata da organização do trabalho.", ["organizacional"]),
c(T.met, "Em um sistema humano-máquina-ambiente, o ambiente pode incluir também os aspectos ___, com estudos de grupos ou organizações produtivas.", ["sociais"]),
m(T.met, "Qual a relação correta entre método e técnica?", "O método é mais amplo e pode reunir várias técnicas", ["A técnica é mais ampla e reúne vários métodos", "Método e técnica são sinônimos", "A técnica define os objetivos e o método apenas executa"]),
m(T.met, "A ergonomia física abrange principalmente:", "Fatores ambientais, máquinas, ferramentas e postos de trabalho", ["Interação humano-computador", "Organização do trabalho", "Processos de tomada de decisão"]),
m(T.met, "Qual das opções NÃO é citada como técnica de coleta de dados para verificar a satisfação do consumidor com um novo produto?", "Análise estatística", ["Observação", "Questionários escritos", "Grupo de foco"], "A análise estatística é aplicada depois, quando os dados já foram coletados."),
m(T.met, "Por que a escolha de métodos na ergonomia tem uma dificuldade adicional?", "Pela sua natureza interdisciplinar, cada profissional vê o problema pelo seu viés", ["Porque existem poucos métodos disponíveis", "Porque os métodos são sempre muito baratos", "Porque a ergonomia não usa ciências humanas"]),
v(T.met, "A mesma técnica pode ser utilizada em vários tipos de métodos.", true),
v(T.met, "Em princípio, existe um método ótimo para cada tipo de problema.", false, "Não se pode afirmar que haja método ótimo, devido às condições limitantes da prática."),
v(T.met, "Um método considerado ótimo pode se mostrar inviável por falta de recursos ou inabilidade dos pesquisadores.", true),
v(T.met, "Um método subótimo pode produzir resultados mais interessantes do que um ótimo inviável na prática.", true),
v(T.met, "Entrevistar consumidores é mais barato e rápido do que aplicar questionários online.", false, "Entrevistas exigem treinar equipe e são demoradas; questionários online têm custo reduzido, mas podem prejudicar a qualidade das informações."),
v(T.met, "Alguns métodos são mais detalhados, mas exigem mais habilidade, tempo e dinheiro.", true),

// ───────────── QUESTIONÁRIO ─────────────
c(T.qst, "Em questões de opinião, deve-se colocar a opção 'nenhuma das respostas anteriores', pois cerca de ___% a 30% das pessoas costumam assinalá-la.", ["10|dez"]),
c(T.qst, "Para variáveis contínuas, pode-se colocar uma escala para medir a ___ de um fator.", ["intensidade"]),
c(T.qst, "Em respostas dicotômicas, as pessoas tendem a responder '___' ou 'Concordo'.", ["sim"]),
c(T.qst, "Com número ímpar de opções, as pessoas tendem a marcar a central: é a tendência ___.", ["central"]),
c(T.qst, "Alguns autores recomendam colocar um número ___ de opções para evitar a tendência central.", ["par"]),
c(T.qst, "O questionário deve ser validado com uma pequena amostra de ___ a ___ pessoas, representativa do público-alvo.", ["dez|10", "trinta|30"]),
c(T.qst, "O teste de validação do questionário também serve para verificar o uso de ___ adequado.", ["vocabulário|vocabulario"]),
c(T.qst, "O efeito ___ distorce as respostas porque as pessoas valorizam fatos recentes ou que provocaram maiores emoções, generalizando a situação.", ["halo"]),
c(T.qst, "O efeito halo manifesta-se com mais facilidade quando a pergunta é genérica ou ___.", ["subjetiva"]),
c(T.qst, "O efeito halo pode ser contornado colocando perguntas mais ___ relacionadas ao tema.", ["objetivas"]),
c(T.qst, "Na escala linear da Figura 3.3, os extremos são 'Péssimo' e '___'.", ["excelente"]),
c(T.qst, "O questionário deve ser elaborado em duas ou mais ___, sendo o modelo inicial submetido a um teste de validação.", ["etapas|fases"]),
m(T.qst, "No exemplo do efeito halo, qual carro tende a ser pior avaliado?", "O carro B, que raramente exigia manutenção, mas falhou em situação desagradável", ["O carro A, que exigia manutenção constante", "Os dois igualmente", "Nenhum dos dois"], "A falha do carro B ocorreu numa estrada deserta, à noite, com chuva e crianças chorando — a situação desagradável é generalizada."),
m(T.qst, "Qual pergunta ajudaria a contornar o efeito halo no exemplo dos carros?", "Quantas vezes o carro A e o carro B exigiram manutenções no ano passado?", ["Qual carro você prefere?", "Qual marca é a melhor?", "Você recomendaria o carro B?"]),
m(T.qst, "Por que formular opções que exijam interpretação e raciocínio, em vez de apenas Sim/Não?", "Porque respostas dicotômicas tendem a 'Sim' ou 'Concordo'", ["Porque Sim/Não é difícil de tabular", "Porque exige menos tempo do respondente", "Porque elimina a necessidade de validação"]),
m(T.qst, "Qual é uma vantagem do questionário (Tabela 3.1)?", "Economia de tempo e de custo", ["Grande flexibilidade", "Profundidade das respostas", "Possibilidade de redirecionar a conversa"]),
m(T.qst, "Qual é uma desvantagem do questionário (Tabela 3.1)?", "Pouca flexibilidade e superficialidade", ["Tempo longo de aplicação", "Depende da habilidade do líder", "Influência do observador"]),
v(T.qst, "A opção 'nenhuma das respostas anteriores' é pior que forçar o respondente a escolher outra resposta.", false, "Ela é melhor que forçar uma resposta; deve ser codificada."),
v(T.qst, "O questionário deve ser reproduzido em grande quantidade antes de passar pelo teste de validação.", false),
v(T.qst, "O efeito halo ocorre mais facilmente com perguntas objetivas.", false, "Ocorre mais com perguntas genéricas ou subjetivas."),
v(T.qst, "No exemplo dos carros, o carro A gastou em cinco anos o equivalente a 10% do seu valor com manutenção.", true, "2% ao ano × 5 anos."),
v(T.qst, "O questionário permite preenchimento online e grande número de sujeitos.", true),

// ───────────── ENTREVISTA E GRUPO DE FOCO ─────────────
c(T.ent, "Entrevista é um tipo de conversa ___ com certos objetivos.", ["dirigida"]),
c(T.ent, "Na entrevista informal não há ___ previamente elaborado.", ["roteiro"]),
c(T.ent, "Na entrevista ___, existem perguntas prévias, mas elas podem ser alteradas durante a entrevista de acordo com as respostas obtidas.", ["semiestruturada|semi-estruturada|semi estruturada"]),
c(T.ent, "Na entrevista ___, segue-se uma sequência de perguntas previamente elaboradas.", ["estruturada"]),
c(T.ent, "Uma entrevista geralmente abrange ___ fases (Robson, 1993).", ["cinco|5"]),
c(T.ent, "Na fase de ___, inicia-se com perguntas fáceis, para posicionar-se sobre o assunto e reduzir o estresse.", ["degelo"]),
c(T.ent, "No conteúdo principal, as questões de natureza mais ___ ficam para o final.", ["polêmica|polemica|polêmicas|polemicas"]),
c(T.ent, "As questões devem ser ordenadas do ___ para o complexo.", ["simples"]),
c(T.ent, "A maior vantagem das entrevistas é a flexibilidade e a ___.", ["adaptabilidade"]),
c(T.ent, "A principal desvantagem da entrevista é a ___.", ["demora|lentidão|lentidao"]),
c(T.ent, "É difícil conseguir resultados interessantes antes dos ___ minutos e entrevistas acima de uma ___ tornam-se pouco produtivas.", ["trinta|30", "hora|1 hora|uma hora"]),
c(T.ent, "Cada hora de gravação exige aproximadamente ___ horas para transcrição.", ["dez|10"]),
c(T.ent, "O entrevistador deve ouvir mais e ___ menos.", ["falar"]),
c(T.ent, "Ao entrevistar um trabalhador da construção civil, deve-se perguntar se a ferramenta '___', em vez de 'provoca lesões'.", ["machuca"]),
c(T.ent, "O método ___ consulta um grupo de especialistas em várias rodadas sucessivas, até que se alcance algum tipo de consenso.", ["delphi"]),
c(T.ent, "O grupo de foco (focus group) é uma entrevista coletiva realizada com ___ a ___ pessoas.", ["seis|6", "dez|10"]),
c(T.ent, "A técnica do grupo de foco foi desenvolvida na área de ___.", ["marketing"]),
c(T.ent, "Em ergonomia, o grupo de foco é usado principalmente na ___.", ["macroergonomia"]),
c(T.ent, "A maior vantagem do grupo de foco está na neutralização da influência do ___.", ["entrevistador"]),
c(T.ent, "O coordenador do grupo de foco deve conhecer os objetivos, mas manter-se ___.", ["neutro"]),
m(T.ent, "Qual é a ordem correta das fases da entrevista?", "Introdução, degelo, conteúdo principal, finalização, fechamento", ["Degelo, introdução, conteúdo principal, fechamento, finalização", "Introdução, conteúdo principal, degelo, finalização, fechamento", "Conteúdo principal, introdução, degelo, fechamento, finalização"]),
m(T.ent, "Por que as questões polêmicas ficam para o final do conteúdo principal?", "Se o entrevistado se recusar a prosseguir, perdem-se menos informações", ["Para estressar o entrevistado", "Porque são as mais fáceis", "Para encurtar a entrevista"]),
m(T.ent, "Qual das perguntas abaixo é tendenciosa?", "Você não acha que os capacetes são incômodos?", ["Como você avalia o conforto do capacete?", "O capacete incomoda em algum momento?", "O que você acha do capacete?"]),
m(T.ent, "Na fase de fechamento da entrevista, o entrevistador:", "Explica como o conteúdo será utilizado, se haverá retorno, e agradece", ["Faz as perguntas mais polêmicas", "Apresenta-se e pede permissão para gravar", "Faz perguntas fáceis para reduzir o estresse"]),
m(T.ent, "Na fase de introdução, o entrevistador:", "Apresenta-se, fala dos objetivos, pede permissão para gravar e garante confidencialidade", ["Inicia com perguntas fáceis", "Explica como o conteúdo será usado", "Faz perguntas diretas para reforçar"]),
m(T.ent, "Qual é um exemplo de aplicação de entrevista com múltiplos pontos de vista?", "Entrevistar o operador, seu supervisor imediato e o dirigente da empresa sobre o mesmo problema", ["Entrevistar apenas o operador em três ocasiões", "Entrevistar três operadores sobre problemas diferentes", "Entrevistar somente o gerente"]),
m(T.ent, "Qual é uma vantagem do grupo de foco (Tabela 3.1)?", "Sinergia do grupo, baixo custo e tempo curto", ["Facilidade de compilação numérica", "Realismo da pesquisa", "Independe da habilidade do líder"]),
m(T.ent, "Qual é uma desvantagem do grupo de foco?", "Depende da habilidade do líder e é difícil sintetizar as respostas", ["Custo elevado", "Tempo longo", "Influência do observador"]),
m(T.ent, "O grupo de foco é particularmente útil:", "Nas etapas iniciais e intermediárias de um projeto", ["Apenas após o protótipo estar pronto", "Somente na fase de produção", "Apenas para coleta de dados quantitativos"]),
m(T.ent, "O método Delphi pode ser aplicado, por exemplo, para:", "Consultar trabalhadores, supervisores e gerentes sobre prioridades de melhoria das condições de trabalho", ["Medir a frequência cardíaca", "Observar posturas com filmagem", "Calcular o limite de peso recomendado"]),
v(T.ent, "O entrevistador deve emitir opiniões próprias para deixar o entrevistado à vontade.", false, "Deve ouvir mais, falar menos e manter posição neutra."),
v(T.ent, "Perguntas longas ou complexas podem ser desdobradas.", true),
v(T.ent, "Entrevistas gravadas exigem consentimento prévio do entrevistado.", true),
v(T.ent, "O grupo de foco pode ser usado somente nas etapas finais do projeto.", false),
v(T.ent, "Os participantes do grupo de foco devem ser representativos do público-alvo e dispostos a colaborar.", true),
v(T.ent, "A entrevista pela internet pode ser interessante para coletar informações detalhadas sobre determinados assuntos.", true),
v(T.ent, "É recomendável dar tratamentos diferenciados aos entrevistados para deixá-los mais confortáveis.", false, "Deve-se manter as mesmas condições para todos."),

// ───────────── OBSERVAÇÃO DIRETA ─────────────
c(T.obs, "A técnica de observação direta consiste em observar aquilo que as pessoas ___ e registrar de alguma forma.", ["fazem"]),
c(T.obs, "Historicamente, a observação foi aplicada em biologia, etologia e psicologia ___ para estudar comportamento de seres não humanos.", ["experimental"]),
c(T.obs, "Para que as informações sejam confiáveis, devem apresentar ___ ao longo do tempo.", ["estabilidade|constância|constancia"]),
c(T.obs, "A principal vantagem da observação direta é o seu ___.", ["realismo"]),
c(T.obs, "Diferente de entrevistas e questionários, a observação direta evita que as pessoas 'falem uma coisa e façam outra' — por isso tem mais ___.", ["realismo"]),
c(T.obs, "A primeira desvantagem da observação direta é o efeito provocado pela ___ do observador, semelhante ao efeito Hawthorne.", ["presença|presenca"]),
c(T.obs, "Duas formas de reduzir o efeito do observador: a mínima ___ e o hábito.", ["interação|interacao"]),
c(T.obs, "A segunda desvantagem da observação direta é o ___ gasto.", ["tempo"]),
c(T.obs, "Recomenda-se desprezar as ___ observações, até se atingir um 'regime normal'.", ["primeiras"]),
c(T.obs, "Na observação ___, o observador tem grande liberdade para escolher as informações e a maneira de registrá-las.", ["informal"]),
c(T.obs, "A observação ___ envolve trabalho prévio de seleção, classificação e descrição dos eventos a serem observados.", ["formal"]),
c(T.obs, "A observação formal tem a vantagem da objetividade, mas apresenta maior ___ em relação à informal.", ["rigidez"]),
c(T.obs, "A observação ___ é feita sem interrupção durante certo intervalo de tempo.", ["contínua|continua"]),
c(T.obs, "Na observação por ___, os intervalos entre dois registros consecutivos variam aleatoriamente.", ["amostragem"]),
c(T.obs, "A aleatoriedade na observação por amostragem é obtida com tabelas de números ao ___.", ["acaso"]),
c(T.obs, "A observação contínua é análoga a uma cena filmada em vídeo; a amostragem é análoga a vários ___ instantâneos.", ["flashes|flash"]),
m(T.obs, "A observação contínua é muito utilizada em:", "Trabalhos repetitivos de ciclos curtos, onde se conta o número de ações", ["Fenômenos raros como festas anuais", "Contagem de pessoas em fila", "Avaliações fisiológicas"]),
m(T.obs, "O que torna a observação direta demorada em certos casos?", "Fenômenos de baixa frequência exigem longos períodos de observação", ["A necessidade de transcrição de gravações", "A elaboração do questionário", "A validação com 10 a 30 pessoas"]),
m(T.obs, "Qual vantagem tem a observação informal?", "Flexibilidade para o observador experiente ajustar seu percurso", ["Objetividade e facilidade de análise", "Categorias prévias de eventos", "Ausência de efeito do observador"]),
m(T.obs, "Qual desvantagem tem a observação informal?", "Dificuldade posterior para organizar, analisar e tirar conclusões", ["Rigidez excessiva", "Impossibilidade de fazer anotações", "Alto custo de equipamentos"]),
m(T.obs, "Na observação por amostragem aplicada ao desconforto de uma cadeira, o observador verifica nos horários sorteados:", "Se a pessoa ainda permanece na mesma postura ou se mudou", ["A frequência cardíaca da pessoa", "O peso levantado", "A opinião da pessoa sobre a cadeira"]),
v(T.obs, "A observação direta não sofre influência do observador.", false),
v(T.obs, "A observação formal costuma ser precedida de uma fase informal para selecionar as categorias de ações.", true),
v(T.obs, "A observação por amostragem pode ser aplicada a um grupo de pessoas, como na contagem de pessoas em uma fila.", true),
v(T.obs, "Na observação por amostragem, os horários de observação são definidos previamente de forma aleatória.", true),
v(T.obs, "Manual escrito de procedimentos ajuda a garantir constância dos procedimentos humanos de observação.", true),

// ───────────── TÉCNICAS PSICOFÍSICAS ─────────────
c(T.psi, "As técnicas de ergonomia física baseiam-se em antropometria, fisiologia/metabolismo e ___.", ["biomecânica|biomecanica"]),

v(T.aet, "A análise ergonômica deve incluir avaliação e revisão das providências com participação de trabalhadores, supervisores e gerentes.", true),
v(T.aet, "A demanda pode ter origem apenas na direção da empresa.", false, "Também de trabalhadores, sindicatos e órgãos de fiscalização."),

// ───────────── PERGUNTAS ABERTAS DE REVISÃO (fim do capítulo) ─────────────
o(T.met, "Como se diferenciam métodos de técnicas?", "Técnicas são operações/ações ou modos de executar uma atividade e são hierarquicamente inferiores ao método. O método é mais amplo e pode ser composto de várias técnicas; a mesma técnica pode servir a vários métodos."),
o(T.aet, "Quais são as metas da Análise Ergonômica do Trabalho (AET)?", "Observar, diagnosticar e corrigir uma situação real de trabalho aplicando conhecimentos de ergonomia: analisar a demanda, a tarefa (prescrito) e a atividade (real), formular o diagnóstico e fazer recomendações ergonômicas."),
o(T.qst, "Quais são as vantagens e desvantagens do questionário?", "Vantagens: grande número de sujeitos, economia de tempo e custo, facilidade de compilação com resultados numéricos, preenchimento online. Desvantagens: pouca flexibilidade, superficialidade e distorções nas respostas (ex.: efeito halo)."),
o(T.ent, "Que cuidados devem ser tomados nas entrevistas?", "Ouvir mais e falar menos; perguntas curtas e diretas; vocabulário adequado ao entrevistado; eliminar perguntas tendenciosas; manter postura adequada; evitar tratamentos diferenciados; obter consentimento para gravar; deixar o entrevistado à vontade."),
o(T.ent, "Quando se aplica o grupo de foco?", "Em etapas iniciais do projeto (definir características) e intermediárias (avaliar alternativas), ou como complemento a entrevistas e questionários; reúne 6 a 10 pessoas representativas, com coordenador neutro. Maior vantagem: neutralizar a influência do entrevistador."),
o(T.obs, "Quais são as vantagens e desvantagens da observação direta?", "Vantagem: realismo (as pessoas 'falam uma coisa e fazem outra'). Desvantagens: efeito da presença do observador (tipo Hawthorne) e o tempo gasto, sobretudo em eventos de baixa frequência."),
o(T.psi, "Quando e como se aplica o diagrama de dores (áreas dolorosas)?", "Ao final de um período de trabalho, com o diagrama do corpo em vista dorsal dividido em 12 segmentos simétricos: o trabalhador aponta onde sente dor e avalia o desconforto de 0 (sem problema) a 5 (insuportável). Serve para mapear rápido e barato a empresa e priorizar níveis 4 e 5."),
o(T.pos, "Qual é a utilidade do sistema OWAS?", "Registrar e analisar posturas de trabalho (dorso, braços, pernas e carga), com código de seis dígitos, 252 combinações possíveis, observações a cada ~30 s (mín. 100), classificando em 4 classes de ação, apontando posturas que precisam de melhoria."),
o(T.ocr, "Quais são as principais recomendações da equação de NIOSH?", "Calcular o limite de peso recomendado (LPR) a partir de 23 kg de referência, reduzido por seis fatores (H, V, D, A, F, C) ≤ 1,0, para levantamentos repetitivos com as duas mãos; otimizar os fatores (aproximar a carga, reduzir deslocamento/assimetria/frequência, melhorar a pega) para respeitar o limite."),
o(T.ocr, "Qual é a vantagem da avaliação NASA-TLX?", "Avalia quantitativamente a carga de trabalho de forma multidimensional (mental, física, temporal, performance, esforço e frustração), com média ponderada pelos pesos que o próprio sujeito atribui às dimensões; não avalia só a carga mental."),
];

</script>
<script>
(() => {
const $app = document.getElementById("app");
const KEY = "ergo-simulado-v1";
const TYPE_LABEL = { c: "Completar", m: "Múltipla escolha", v: "Verdadeiro/Falso", o: "Pergunta aberta" };

// ids estáveis (hash do enunciado) para o progresso sobreviver a edições na ordem
const hash = s => { let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.charCodeAt(0)) >>> 0; return h.toString(36); };
QUESTIONS.forEach(q => q.id = hash((q.text || q.q) + q.type));

const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const save = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
let store = load(); store.stats = store.stats || {}; store.prefs = store.prefs || {};

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[-–_]/g, " ").replace(/[^a-z0-9 /,.%]/g, "").replace(/%/g, "").replace(/\s+/g, " ").trim();
const lev = (a, b) => { const d = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return d[a.length][b.length]; };
// retorna "exact" | "typo" | "" ; erro de digitação (1 letra) só vale para palavras longas
const matchBlank = (input, alts) => {
  const u = norm(input); if (!u) return "";
  let typo = false;
  for (const a of alts) { const n = norm(a); if (u === n) return "exact"; if (n.length >= 7 && lev(u, n) <= 1) typo = true; }
  return typo ? "typo" : "";
};

const record = (q, ok) => { const s = store.stats[q.id] || { ok: 0, bad: 0 }; s[ok ? "ok" : "bad"]++; s.last = ok; store.stats[q.id] = s; save(store); };

// ───────── estado da rodada ─────────
let run = null;

function topicsList() { return [...new Set(QUESTIONS.map(q => q.topic))]; }

function home() {
  run = null;
  const prefs = store.prefs;
  const topics = topicsList();
  const selT = new Set(prefs.topics || topics);
  const selY = new Set(prefs.types || ["c", "m", "v"]);
  const count = prefs.count || 20;
  const wrongIds = QUESTIONS.filter(q => store.stats[q.id] && store.stats[q.id].last === false);
  const unseen = QUESTIONS.filter(q => !store.stats[q.id]);
  const seen = QUESTIONS.length - unseen.length;
  const totOk = Object.values(store.stats).reduce((a, s) => a + s.ok, 0), totBad = Object.values(store.stats).reduce((a, s) => a + s.bad, 0);
  const acc = totOk + totBad ? Math.round(100 * totOk / (totOk + totBad)) : 0;

  $app.innerHTML = `
  <h1>Simulado de Ergonomia</h1>
  <div class="sub">Cap. 3 — Métodos e técnicas em ergonomia · ${QUESTIONS.length} questões · o progresso fica salvo neste navegador</div>
  <div class="card"><div class="stats">
    <div class="stat"><b>${seen}/${QUESTIONS.length}</b><span>questões já vistas</span></div>
    <div class="stat"><b>${acc}%</b><span>acerto geral</span></div>
    <div class="stat"><b>${wrongIds.length}</b><span>para revisar (último erro)</span></div>
  </div></div>
  <div class="card">
    <h2 style="margin-top:0">Tipos de questão</h2>
    <div class="row" id="types">${Object.entries(TYPE_LABEL).map(([k, l]) => `<button class="chip ${selY.has(k) ? "on" : ""}" data-t="${k}">${l} (${QUESTIONS.filter(q => q.type === k).length})</button>`).join("")}</div>
    <h2>Assuntos <button class="chip" id="allT" style="margin-left:6px">todos / nenhum</button></h2>
    <div class="topics" id="topics">${topics.map(t => {
      const qs = QUESTIONS.filter(q => q.topic === t); const st = qs.map(q => store.stats[q.id]).filter(Boolean);
      const ok = st.reduce((a, s) => a + s.ok, 0), bad = st.reduce((a, s) => a + s.bad, 0);
      return `<label class="topic ${selT.has(t) ? "on" : ""}"><input type="checkbox" value="${esc(t)}" ${selT.has(t) ? "checked" : ""}><span>${esc(t)}<small>${qs.length} questões${ok + bad ? ` · ${Math.round(100 * ok / (ok + bad))}% de acerto` : ""}</small></span></label>`; }).join("")}</div>
    <h2>Quantas questões?</h2>
    <div class="row" id="counts">${[10, 20, 50, 100, 0].map(n => `<button class="chip ${count === n ? "on" : ""}" data-n="${n}">${n || "Todas"}</button>`).join("")}</div>
    <div class="row" style="margin-top:18px">
      <button class="pri" id="go">Começar simulado</button>
      <button id="goWrong" ${wrongIds.length ? "" : "disabled"}>Revisar só os erros (${wrongIds.length})</button>
      <button id="goNew" ${unseen.length ? "" : "disabled"}>Só as nunca vistas (${unseen.length})</button>
      <button class="right" id="reset">Zerar progresso</button>
    </div>
  </div>
  <div class="hint">Dica: nas questões de completar, acentos e maiúsculas não importam. Atalhos: Enter confirma/avança · 1–4 escolhem alternativas.</div>`;

  const readSel = () => ({
    types: [...document.querySelectorAll("#types .on")].map(b => b.dataset.t),
    topics: [...document.querySelectorAll("#topics input:checked")].map(i => i.value),
    count: +document.querySelector("#counts .on").dataset.n,
  });
  document.getElementById("types").onclick = e => { const b = e.target.closest("button"); if (b) b.classList.toggle("on"); };
  document.getElementById("counts").onclick = e => { const b = e.target.closest("button"); if (!b) return; document.querySelectorAll("#counts .chip").forEach(x => x.classList.remove("on")); b.classList.add("on"); };
  document.getElementById("topics").onchange = e => e.target.closest(".topic").classList.toggle("on", e.target.checked);
  document.getElementById("allT").onclick = () => { const all = [...document.querySelectorAll("#topics input")]; const any = all.some(i => !i.checked); all.forEach(i => { i.checked = any; i.closest(".topic").classList.toggle("on", any); }); };
  const start = (filter) => {
    const s = readSel(); store.prefs = s; save(store);
    let pool = QUESTIONS.filter(q => s.types.includes(q.type) && s.topics.includes(q.topic) && (!filter || filter(q)));
    if (!pool.length) { alert("Nenhuma questão com esses filtros."); return; }
    pool = shuffle(pool); if (s.count) pool = pool.slice(0, s.count);
    begin(pool);
  };
  document.getElementById("go").onclick = () => start();
  document.getElementById("goWrong").onclick = () => start(q => store.stats[q.id] && store.stats[q.id].last === false);
  document.getElementById("goNew").onclick = () => start(q => !store.stats[q.id]);
  document.getElementById("reset").onclick = () => { if (confirm("Apagar todo o progresso salvo?")) { store.stats = {}; save(store); home(); } };
}

function begin(pool) { run = { pool, i: 0, answers: [], answered: false }; show(); }

function show() {
  if (run.i >= run.pool.length) return finish();
  const q = run.pool[run.i]; run.answered = false; run.cur = null;
  const pct = Math.round(100 * run.i / run.pool.length);
  const okN = run.answers.filter(a => a.ok).length;
  let body = "";
  if (q.type === "c") {
    let k = 0; body = `<div class="q">${esc(q.text).replace(/___/g, () => `<input class="blank" data-k="${k++}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="lacuna">`)}</div>
      <div class="row"><button class="pri" id="check">Responder</button><button id="skip">Não sei</button></div>`;
  } else if (q.type === "m") {
    q.opts = shuffle([q.correct, ...q.wrong]);
    body = `<div class="q">${esc(q.q)}</div><div class="opts">${q.opts.map((o, n) => `<button class="opt" data-n="${n}"><span class="k">${n + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  } else if (q.type === "v") {
    body = `<div class="q">${esc(q.q)}</div><div class="opts"><button class="opt" data-v="1"><span class="k">1</span><span>Verdadeiro</span></button><button class="opt" data-v="0"><span class="k">2</span><span>Falso</span></button></div>`;
  } else {
    body = `<div class="q">${esc(q.q)}</div><textarea id="free" placeholder="Escreva sua resposta com suas palavras (opcional)…"></textarea><div class="row" style="margin-top:10px"><button class="pri" id="reveal">Mostrar resposta modelo</button></div>`;
  }
  $app.innerHTML = `
    <div class="row"><button id="quit">← Sair</button><span class="right sub" style="margin:0">${okN} acertos em ${run.answers.length}</span></div>
    <div class="bar" style="margin-top:12px"><i style="width:${pct}%"></i></div>
    <div class="meta"><span>Questão ${run.i + 1} de ${run.pool.length}</span><span><span class="badge">${TYPE_LABEL[q.type]}</span>${esc(q.topic)}</span></div>
    <div class="card" id="card">${body}<div id="fb"></div></div>`;
  document.getElementById("quit").onclick = () => { if (!run.answers.length || confirm("Sair da rodada? O que já foi respondido fica salvo.")) home(); };
  wire(q);
}

function wire(q) {
  if (q.type === "c") {
    const inputs = [...document.querySelectorAll("input.blank")];
    inputs[0].focus();
    inputs.forEach((inp, n) => inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); if (run.answered) return; n < inputs.length - 1 ? inputs[n + 1].focus() : checkCloze(q, inputs); } }));
    document.getElementById("check").onclick = () => checkCloze(q, inputs);
    document.getElementById("skip").onclick = () => checkCloze(q, inputs, true);
  } else if (q.type === "m") {
    document.querySelectorAll(".opt").forEach(b => b.onclick = () => answerMC(q, +b.dataset.n));
  } else if (q.type === "v") {
    document.querySelectorAll(".opt").forEach(b => b.onclick = () => answerVF(q, b.dataset.v === "1"));
  } else {
    document.getElementById("reveal").onclick = () => revealOpen(q);
  }
}

function checkCloze(q, inputs, giveUp) {
  if (run.answered) return; run.answered = true;
  let allOk = true, typo = false;
  inputs.forEach((inp, n) => { const r = giveUp ? "" : matchBlank(inp.value, q.answers[n]); inp.classList.add(r ? "ok" : "ko"); inp.readOnly = true; if (!r) allOk = false; if (r === "typo") typo = true; });
  const gab = q.answers.map(a => `<b>${esc(a[0])}</b>`).join(" · ");
  const rec = { q, ok: allOk, given: inputs.map(i => i.value).join(" / ") || "(em branco)" };
  run.answers.push(rec); record(q, allOk);
  const fb = document.getElementById("fb");
  fb.innerHTML = `<div class="fb ${allOk ? (typo ? "wa" : "ok") : "ko"}"><b class="t">${allOk ? (typo ? "Aceito (quase igual, confira a grafia)" : "Correto!") : (giveUp ? "Sem problema — veja a resposta" : "Não foi dessa vez")}</b>
    ${allOk && !typo ? "" : `Resposta: ${gab}`}${q.answers.some(a => a.length > 1) && !allOk ? `<div class="exp">Também aceito: ${q.answers.map(a => a.slice(1).map(esc).join(", ") || "—").join(" · ")}</div>` : ""}
    ${q.exp ? `<div class="exp">${esc(q.exp)}</div>` : ""}</div>
    <div class="row" style="margin-top:12px"><button class="pri" id="next">Próxima →</button>${allOk ? "" : `<button id="override">Minha resposta estava certa</button>`}</div>`;
  const ov = document.getElementById("override");
  if (ov) ov.onclick = () => { rec.ok = true; const s = store.stats[q.id]; s.bad--; s.ok++; s.last = true; save(store); inputs.forEach(i => { i.classList.remove("ko"); i.classList.add("ok"); }); ov.remove(); fb.querySelector(".fb").className = "fb ok"; fb.querySelector("b.t").textContent = "Marcada como correta"; };
  document.getElementById("next").onclick = next; document.getElementById("next").focus();
}

function answerMC(q, n) {
  if (run.answered) return; run.answered = true;
  const ok = q.opts[n] === q.correct;
  document.querySelectorAll(".opt").forEach((b, i) => { b.disabled = true; if (q.opts[i] === q.correct) b.classList.add("ok"); else if (i === n) b.classList.add("ko"); });
  run.answers.push({ q, ok, given: q.opts[n] }); record(q, ok);
  feedback(q, ok, `Resposta certa: <b>${esc(q.correct)}</b>`);
}
function answerVF(q, val) {
  if (run.answered) return; run.answered = true;
  const ok = val === q.ans;
  document.querySelectorAll(".opt").forEach(b => { b.disabled = true; const bv = b.dataset.v === "1"; if (bv === q.ans) b.classList.add("ok"); else if (bv === val) b.classList.add("ko"); });
  run.answers.push({ q, ok, given: val ? "Verdadeiro" : "Falso" }); record(q, ok);
  feedback(q, ok, `A afirmação é <b>${q.ans ? "verdadeira" : "falsa"}</b>.`);
}
function feedback(q, ok, line) {
  document.getElementById("fb").innerHTML = `<div class="fb ${ok ? "ok" : "ko"}"><b class="t">${ok ? "Correto!" : "Incorreto"}</b>${ok ? "" : line}${q.exp ? `<div class="exp">${esc(q.exp)}</div>` : ""}</div><div class="row" style="margin-top:12px"><button class="pri" id="next">Próxima →</button></div>`;
  document.getElementById("next").onclick = next; document.getElementById("next").focus();
}
function revealOpen(q) {
  if (run.answered) return; run.answered = true;
  const mine = document.getElementById("free").value.trim();
  document.getElementById("free").readOnly = true;
  document.getElementById("reveal").remove();
  document.getElementById("fb").innerHTML = `<div class="fb wa"><b class="t">Resposta modelo</b>${esc(q.model)}</div>
    <p class="exp" style="margin-bottom:6px">Compare com a sua resposta. Você acertou o essencial?</p>
    <div class="row"><button class="pri" id="yes">Acertei</button><button id="no">Preciso rever</button></div>`;
  const done = ok => { run.answers.push({ q, ok, given: mine || "(sem texto)" }); record(q, ok); next(); };
  document.getElementById("yes").onclick = () => done(true); document.getElementById("no").onclick = () => done(false);
}

function next() { run.i++; show(); }

function finish() {
  const total = run.answers.length, ok = run.answers.filter(a => a.ok).length, pct = total ? Math.round(100 * ok / total) : 0;
  const by = {}; run.answers.forEach(a => { const t = a.q.topic; by[t] = by[t] || [0, 0]; by[t][1]++; if (a.ok) by[t][0]++; });
  const misses = run.answers.filter(a => !a.ok);
  const ans = a => a.q.type === "c" ? a.q.answers.map(x => x[0]).join(" · ") : a.q.type === "m" ? a.q.correct : a.q.type === "v" ? (a.q.ans ? "Verdadeiro" : "Falso") : a.q.model;
  const stmt = a => a.q.type === "c" ? a.q.text : a.q.q;
  $app.innerHTML = `<h1>Resultado</h1>
  <div class="card"><div class="stats">
    <div class="stat"><b>${ok}/${total}</b><span>acertos</span></div>
    <div class="stat"><b>${pct}%</b><span>aproveitamento</span></div>
    <div class="stat"><b>${misses.length}</b><span>para revisar</span></div></div>
    <h2>Por assunto</h2>${Object.entries(by).map(([t, [a, b]]) => `<div class="meta" style="margin:6px 0 2px"><span>${esc(t)}</span><span>${a}/${b}</span></div><div class="bar"><i style="width:${100 * a / b}%"></i></div>`).join("")}
  </div>
  ${misses.length ? `<div class="card"><h2 style="margin-top:0">O que você errou</h2>${misses.map(a => `<div class="miss"><div>${esc(stmt(a))}</div><div><small>Você: ${esc(a.given)}</small></div><div><b style="color:var(--ok)">${esc(ans(a))}</b></div>${a.q.exp ? `<small>${esc(a.q.exp)}</small>` : ""}</div>`).join("")}</div>` : `<div class="card">🎉 Rodada perfeita!</div>`}
  <div class="row">${misses.length ? `<button class="pri" id="again">Refazer só os erros</button>` : ""}<button id="home" ${misses.length ? "" : 'class="pri"'}>Nova rodada</button></div>`;
  const again = document.getElementById("again"); if (again) again.onclick = () => begin(shuffle(misses.map(a => a.q)));
  document.getElementById("home").onclick = home;
}

// atalhos globais
document.addEventListener("keydown", e => {
  if (!run || e.target.tagName === "TEXTAREA") return;
  const q = run.pool[run.i]; if (!q) return;
  if (e.key === "Enter" && run.answered) { const n = document.getElementById("next"); if (n && document.activeElement !== n) { e.preventDefault(); n.click(); } }
  if (!run.answered && e.target.tagName !== "INPUT") {
    if (q.type === "m" && /^[1-4]$/.test(e.key)) answerMC(q, +e.key - 1);
    if (q.type === "v" && (e.key === "1" || e.key === "2")) answerVF(q, e.key === "1");
  }
});

home();
})();
</script>
</body>
